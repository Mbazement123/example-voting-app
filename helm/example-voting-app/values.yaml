replicaCount: 1

images:
  tag: latest
  pullPolicy: IfNotPresent
  vote:
    repository: mbazement123/example-voting-app-vote
  result:
    repository: mbazement123/example-voting-app-result
  worker:
    repository: mbazement123/example-voting-app-worker

imagePullSecrets:
  - name: dockerhub-pull

postgres:
  image: postgres:15-alpine
  existingSecret: voting-app-db
  storage: 2Gi

redis:
  image: redis:alpine