name: Provision infrastructure

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: voting-app-terraform
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Create or update Terraform state bucket
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: bash terraform/bootstrap-state.sh
      - name: Initialize Terraform
        working-directory: terraform
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: >-
          terraform init -input=false
          -backend-config="bucket=$TF_STATE_BUCKET"
          -backend-config="key=example-voting-app/${{ vars.AWS_REGION }}/terraform.tfstate"
          -backend-config="region=${{ vars.AWS_REGION }}"
          -backend-config="encrypt=true"
          -backend-config="use_lockfile=true"
      - name: Apply infrastructure
        working-directory: terraform
        run: >-
          terraform apply -input=false -auto-approve
          -var="aws_region=${{ vars.AWS_REGION }}"
          -var="github_actions_principal_arn=${{ vars.AWS_IAM_PRINCIPAL_ARN }}"