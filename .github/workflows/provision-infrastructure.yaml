name: Provision infrastructure

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: voting-app-terraform
  cancel-in-progress: false

jobs:
  plan:
    name: Plan infrastructure
    runs-on: ubuntu-latest
    steps:
      - name: Require main branch
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Run this workflow from the main branch." >&2
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Create or update Terraform state bucket
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: bash terraform/bootstrap-state.sh
      - name: Initialize Terraform
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: >-
          terraform -chdir=terraform init -reconfigure -input=false
          -backend-config="bucket=$TF_STATE_BUCKET"
          -backend-config="key=example-voting-app/${{ vars.AWS_REGION }}/terraform.tfstate"
          -backend-config="region=${{ vars.AWS_REGION }}"
          -backend-config="encrypt=true"
          -backend-config="use_lockfile=true"
      - name: Plan infrastructure
        run: >-
          terraform -chdir=terraform plan -input=false -lock-timeout=5m
          -var="aws_region=${{ vars.AWS_REGION }}"
          -var="github_actions_principal_arn=${{ vars.AWS_IAM_PRINCIPAL_ARN }}"

  apply:
    name: Apply infrastructure
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Create or update Terraform state bucket
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: bash terraform/bootstrap-state.sh
      - name: Initialize Terraform
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: >-
          terraform -chdir=terraform init -reconfigure -input=false
          -backend-config="bucket=$TF_STATE_BUCKET"
          -backend-config="key=example-voting-app/${{ vars.AWS_REGION }}/terraform.tfstate"
          -backend-config="region=${{ vars.AWS_REGION }}"
          -backend-config="encrypt=true"
          -backend-config="use_lockfile=true"
      - name: Apply infrastructure
        run: >-
          terraform -chdir=terraform apply -input=false -auto-approve
          -var="aws_region=${{ vars.AWS_REGION }}"
          -var="github_actions_principal_arn=${{ vars.AWS_IAM_PRINCIPAL_ARN }}"

  deploy:
    name: Deploy to EKS
    needs: apply
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: voting-app-deploy
      cancel-in-progress: true
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Wait for CI image build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          for attempt in $(seq 1 120); do
            runs=$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow ci-cd.yaml \
              --commit "$IMAGE_TAG" \
              --event push \
              --json databaseId,status,conclusion \
              --limit 10)
            run_id=$(jq -r '.[0].databaseId // empty' <<< "$runs")
            status=$(jq -r '.[0].status // empty' <<< "$runs")

            if [ "$status" = completed ]; then
              conclusion=$(jq -r '.[0].conclusion // empty' <<< "$runs")
              if [ "$conclusion" = success ]; then
                echo "CI completed successfully for $IMAGE_TAG (run $run_id)"
                exit 0
              fi
              echo "CI run $run_id for $IMAGE_TAG completed with conclusion: $conclusion" >&2
              exit 1
            fi

            echo "Waiting for CI image build for $IMAGE_TAG (attempt $attempt/120)"
            sleep 15
          done
          echo "Timed out waiting for CI image build for $IMAGE_TAG" >&2
          exit 1
      - name: Wait for EKS cluster
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          for attempt in $(seq 1 120); do
            status=$(aws eks describe-cluster --name voting-app-dev --region "$AWS_REGION" --query 'cluster.status' --output text 2>/dev/null || true)
            if [ "$status" = ACTIVE ]; then
              exit 0
            fi
            echo "Waiting for EKS cluster to become active (attempt $attempt/120)"
            sleep 15
          done
          echo "EKS cluster did not become active within 30 minutes" >&2
          exit 1
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Verify published application images
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker_username=$(printf '%s' "$DOCKER_USERNAME" | tr '[:upper:]' '[:lower:]')
          for app in vote result worker; do
            image="docker.io/$docker_username/example-voting-app-$app:$IMAGE_TAG"
            if ! docker manifest inspect "$image" >/dev/null 2>&1; then
              echo "Expected image was not published: $image" >&2
              exit 1
            fi
            echo "Verified $image"
          done
      - name: Configure kubectl
        run: aws eks update-kubeconfig --region "${{ vars.AWS_REGION }}" --name voting-app-dev
      - uses: azure/setup-helm@v4
      - name: Create namespace credentials
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          test -n "$POSTGRES_PASSWORD"
          test -n "$DOCKER_USERNAME"
          test -n "$DOCKER_PASSWORD"
          kubectl create namespace voting-app --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic voting-app-db --namespace voting-app --from-literal="password=$POSTGRES_PASSWORD" --dry-run=client -o yaml | kubectl apply -f -
          auth=$(printf '%s:%s' "$DOCKER_USERNAME" "$DOCKER_PASSWORD" | base64 -w0)
          docker_config=$(jq -n --arg username "$DOCKER_USERNAME" --arg password "$DOCKER_PASSWORD" --arg auth "$auth" '{auths:{"https://index.docker.io/v1/":{username:$username,password:$password,auth:$auth}}}')
          printf '%s' "$docker_config" | kubectl create secret generic dockerhub-pull --namespace voting-app --type=kubernetes.io/dockerconfigjson --from-file=.dockerconfigjson=/dev/stdin --dry-run=client -o yaml | kubectl apply -f -
      - name: Deploy Helm release
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker_username=$(printf '%s' "$DOCKER_USERNAME" | tr '[:upper:]' '[:lower:]')
          helm upgrade --install voting-app ./helm/example-voting-app \
            --namespace voting-app \
            --set-string "images.vote.repository=docker.io/$docker_username/example-voting-app-vote" \
            --set-string "images.result.repository=docker.io/$docker_username/example-voting-app-result" \
            --set-string "images.worker.repository=docker.io/$docker_username/example-voting-app-worker" \
            --set-string "images.tag=$IMAGE_TAG" \
            --wait --timeout 10m
