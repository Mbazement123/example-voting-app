name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Integration test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate ephemeral test password
        run: echo "POSTGRES_PASSWORD=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: Run integration test
        run: docker compose -f result/docker-compose.test.yml up --build --abort-on-container-exit --exit-code-from sut
      - name: Stop test services
        if: always()
        run: docker compose -f result/docker-compose.test.yml down --volumes --remove-orphans

  validate:
    name: Validate Terraform and Helm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
      - name: Validate Terraform
        run: |
          terraform -chdir=terraform init -backend=false -input=false
          terraform -chdir=terraform fmt -check -recursive
          terraform -chdir=terraform validate
          terraform -chdir=terraform/state init -backend=false -input=false
          terraform -chdir=terraform/state validate
      - uses: azure/setup-helm@v4
      - name: Lint Helm chart
        run: helm lint helm/example-voting-app

  build_scan_publish:
    name: Build, scan, and publish ${{ matrix.app }}
    runs-on: ubuntu-latest
    needs: [test, validate]
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: vote
            context: ./vote
          - app: result
            context: ./result
          - app: worker
            context: ./worker
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Set image reference
        id: image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY}-${{ matrix.app }}"
          echo "ref=$(printf '%s' "$image" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      # ALWAYS log in to GHCR so we can push on push events (and avoid auth cache misses)
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: ${{ github.event_name == 'push' }} # Push automatically if it's a push event
          tags: ${{ steps.image.outputs.ref }}:${{ github.sha }}
          # Use load: true only if we are scanning locally before pushing
          load: ${{ github.event_name != 'push' }}

      - name: Scan image with Trivy (Pull Request or local check)
        if: github.event_name != 'push'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.ref }}:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL

      # If it's a push event, build-push-action already published it. 
      # We can scan the remote image directly or skip if already secure.