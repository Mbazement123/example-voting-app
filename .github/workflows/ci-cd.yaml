name: CI and deploy

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Integration test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate ephemeral test password
        run: echo "POSTGRES_PASSWORD=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: Run integration test
        run: docker compose -f result/docker-compose.test.yml up --build --abort-on-container-exit --exit-code-from sut
      - name: Stop test services
        if: always()
        run: docker compose -f result/docker-compose.test.yml down --volumes --remove-orphans

  validate:
    name: Validate Terraform and Helm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
      - name: Validate Terraform
        run: |
          terraform -chdir=terraform init -backend=false -input=false
          terraform -chdir=terraform fmt -check -recursive
          terraform -chdir=terraform validate
          terraform -chdir=terraform/state init -backend=false -input=false
          terraform -chdir=terraform/state validate
      - uses: azure/setup-helm@v4
      - name: Lint Helm chart
        run: helm lint helm/example-voting-app

  build_scan_publish:
    name: Build, scan, and publish ${{ matrix.app }}
    runs-on: ubuntu-latest
    needs: [test, validate]
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: vote
            context: ./vote
          - app: result
            context: ./result
          - app: worker
            context: ./worker
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set image reference
        id: image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY}-${{ matrix.app }}"
          echo "ref=$(printf '%s' "$image" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          load: true
          tags: ${{ steps.image.outputs.ref }}:${{ github.sha }}
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@f50c2657e2dfa3e9c704f5e08b1a8f9f743c3b06
        with:
          image-ref: ${{ steps.image.outputs.ref }}:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL
      - name: Push scanned image
        if: github.event_name == 'push'
        run: docker push "${{ steps.image.outputs.ref }}:${{ github.sha }}"

  deploy:
    name: Deploy to EKS
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, build_scan_publish]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: voting-app-deploy
      cancel-in-progress: true
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Wait for EKS cluster
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          for attempt in $(seq 1 120); do
            status=$(aws eks describe-cluster --name voting-app-dev --region "$AWS_REGION" --query 'cluster.status' --output text 2>/dev/null || true)
            if [ "$status" = ACTIVE ]; then
              exit 0
            fi
            echo "Waiting for EKS cluster to become active (attempt $attempt/120)"
            sleep 15
          done
          echo "EKS cluster did not become active within 30 minutes" >&2
          exit 1
      - name: Configure kubectl
        run: aws eks update-kubeconfig --region "${{ vars.AWS_REGION }}" --name voting-app-dev
      - uses: azure/setup-helm@v4
      - name: Create namespace credentials
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          GHCR_USERNAME: ${{ vars.GHCR_USERNAME }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          test -n "$POSTGRES_PASSWORD"
          test -n "$GHCR_USERNAME"
          test -n "$GHCR_PULL_TOKEN"
          kubectl create namespace voting-app --dry-run=client -o yaml | kubectl apply -f -
          printf '%s' "$POSTGRES_PASSWORD" | kubectl create secret generic voting-app-db --namespace voting-app --from-file=password=/dev/stdin --dry-run=client -o yaml | kubectl apply -f -
          auth=$(printf '%s:%s' "$GHCR_USERNAME" "$GHCR_PULL_TOKEN" | base64 -w0)
          docker_config=$(jq -n --arg username "$GHCR_USERNAME" --arg password "$GHCR_PULL_TOKEN" --arg auth "$auth" '{auths:{"ghcr.io":{username:$username,password:$password,auth:$auth}}}')
          printf '%s' "$docker_config" | kubectl create secret generic ghcr-pull --namespace voting-app --type=kubernetes.io/dockerconfigjson --from-file=.dockerconfigjson=/dev/stdin --dry-run=client -o yaml | kubectl apply -f -
      - name: Deploy Helm release
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          image_root="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          helm upgrade --install voting-app ./helm/example-voting-app \
            --namespace voting-app \
            --set-string "images.vote.repository=$image_root-vote" \
            --set-string "images.result.repository=$image_root-result" \
            --set-string "images.worker.repository=$image_root-worker" \
            --set-string "images.tag=$IMAGE_TAG" \
            --wait --timeout 10m
